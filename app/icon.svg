<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2744"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Globe body -->
  <circle cx="256" cy="256" r="180" fill="url(#globe)" stroke="#06b6d4" stroke-width="3" opacity="0.9"/>
  
  <!-- Globe grid lines - latitude -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.25"/>
  <ellipse cx="256" cy="256" rx="180" ry="120" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Globe grid lines - longitude -->
  <ellipse cx="256" cy="256" rx="60" ry="180" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.25"/>
  <ellipse cx="256" cy="256" rx="120" ry="180" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.2"/>
  <line x1="76" y1="256" x2="436" y2="256" stroke="#06b6d4" stroke-width="1.5" opacity="0.2"/>
  <line x1="256" y1="76" x2="256" y2="436" stroke="#06b6d4" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Connection nodes -->
  <circle cx="200" cy="190" r="6" fill="#22d3ee" filter="url(#neon)"/>
  <circle cx="310" cy="220" r="5" fill="#22d3ee" filter="url(#neon)"/>
  <circle cx="280" cy="310" r="6" fill="#22d3ee" filter="url(#neon)"/>
  <circle cx="180" cy="280" r="4" fill="#22d3ee" filter="url(#neon)"/>
  <circle cx="340" cy="170" r="4" fill="#22d3ee" filter="url(#neon)"/>
  
  <!-- Connection lines between nodes -->
  <line x1="200" y1="190" x2="310" y2="220" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
  <line x1="310" y1="220" x2="280" y2="310" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="190" x2="180" y2="280" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>
  <line x1="340" y1="170" x2="310" y2="220" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
  
  <!-- Orbiting ring -->
  <ellipse cx="256" cy="256" rx="240" ry="90" fill="none" stroke="url(#glow)" stroke-width="10" stroke-linecap="round" transform="rotate(-25 256 256)" filter="url(#neon)" stroke-dasharray="900" stroke-dashoffset="250" opacity="0.9"/>
  
  <!-- Cursor arrow at the end of orbit -->
  <g transform="translate(430, 155) rotate(45)">
    <polygon points="0,-20 14,16 0,8 -14,16" fill="#22d3ee" filter="url(#neon)"/>
  </g>
</svg>
